<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/password.css">
    <script src="js/password.js" defer></script>
    <title>Redefinição de Senha</title>
</head>

<body>
    <div class="card-senha">
        <img src="img/HelpSancaLogo.png" alt="Logo">

        <h1>Defina sua nova senha</h1>
        <p class="subtitulo">Escolha uma senha forte para manter seu perfil seguro.</p>

        <form id="changePassword">
            <input type="email" id="email" class="campo-input" placeholder="Email" required>
            <input type="password" id="senhaNova" class="campo-input" placeholder="Nova senha" required>
            <input type="password" id="senhaDenovo" class="campo-input" placeholder="Confirmar senha" required>

            <button type="submit" id="btn-redefinir">Redefinir Senha</button>
        </form>

        <div class="footer-links">
            <button id="logout" onclick="logout()" class="link-voltar">
                Voltar à página inicial
            </button>
        </div>
    </div>
</body>

</html>
